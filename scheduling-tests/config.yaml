kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration: 
          kubeletExtraArgs:
            node-labels: "zone=us-east-1a,capacity=on-demand"
  - role: worker
    extraPortMappings:
      - containerPort: 30950
        hostPort: 80
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration: 
          kubeletExtraArgs:
            node-labels: "zone=us-east-1b,capacity=on-demand"
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration: 
          kubeletExtraArgs:
            node-labels: "zone=us-east-1c,capacity=spot"
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration: 
          kubeletExtraArgs:
            register-with-taints: "infra=presence:NoSchedule"
            node-labels: "component=infra,zone=us-east-1d,capacity=spot"
